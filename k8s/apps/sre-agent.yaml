apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krishnakant888/gitops-k8s-argocd.git
    targetRevision: main
    path: k8s/workloads/sre-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: sre
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
