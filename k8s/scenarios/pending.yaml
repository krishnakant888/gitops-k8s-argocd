apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending
  namespace: scenarios
  labels: { app: pending, scenario: "true" }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pending }
  template:
    metadata:
      labels: { app: pending, scenario: "true" }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep","3600"]
          resources:
            requests: { cpu: "100", memory: 1Ti }
