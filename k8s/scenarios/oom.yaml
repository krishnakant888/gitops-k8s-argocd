apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom
  namespace: scenarios
  labels: { app: oom, scenario: "true" }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oom }
  template:
    metadata:
      labels: { app: oom, scenario: "true" }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","echo \"level=info msg=\\\"allocating memory\\\"\"; tail /dev/zero"]
          resources:
            limits: { memory: 20Mi }
