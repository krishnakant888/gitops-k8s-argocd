apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    # TODO: set to your Git remote once the repo is pushed
    repoURL: https://github.com/YOUR_ORG/gitops-k8s-argocd.git
    targetRevision: main
    path: k8s/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
